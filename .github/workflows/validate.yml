name: Marketplace Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyyaml

      - name: Validate marketplace structure
        run: |
          echo "=== Validating Marketplace Structure ==="

          # Check marketplace.json exists and is valid JSON
          if [ -f ".claude-plugin/marketplace.json" ]; then
            echo "OK marketplace.json exists"
            python -c "import json; json.load(open('.claude-plugin/marketplace.json'))" && echo "OK marketplace.json is valid JSON"
          else
            echo "FAIL marketplace.json not found"
            exit 1
          fi

          # Validate all plugin entries have required fields and valid sources.
          #
          # IMPORTANT: This is inline Python inside a YAML double-quoted shell string.
          # Shell quoting rules apply -- the shell strips inner double quotes before
          # Python sees the code. Therefore:
          #   - NEVER use dict["key"] inside f-strings (shell eats the quotes,
          #     Python sees bare `key` as an undefined variable -> NameError)
          #   - ALWAYS extract dict values into local variables first, then
          #     reference those variables in f-strings
          #   - Use only single quotes inside f-strings
          # See CLAUDE.md "CI/CD Pitfalls" section for full explanation.
          python3 -c "
          import json, sys
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          if not data.get('name'):
              print('FAIL: missing marketplace name')
              sys.exit(1)
          plugins = data.get('plugins', [])
          if not plugins:
              print('FAIL: no plugins defined')
              sys.exit(1)
          for p in plugins:
              name = p.get('name', '?')
              if not p.get('name'):
                  print(f'FAIL: plugin entry missing name')
                  sys.exit(1)
              source = p.get('source')
              if not source:
                  print(f'FAIL: plugin {name} missing source')
                  sys.exit(1)
              if isinstance(source, dict):
                  src_type = source.get('source')
                  # Extract values into locals -- do NOT use source['repo'] in
                  # f-strings because shell quoting will mangle the double quotes
                  repo = source.get('repo', '')
                  url = source.get('url', '')
                  if src_type == 'github' and repo:
                      print(f'OK {name}: GitHub source -> {repo}')
                  elif src_type == 'url' and url:
                      print(f'OK {name}: URL source -> {url}')
                  else:
                      print(f'FAIL: plugin {name} invalid source object (needs source+repo or source+url)')
                      sys.exit(1)
              elif isinstance(source, str):
                  print(f'OK {name}: path source -> {source}')
              else:
                  print(f'FAIL: plugin {name} invalid source type')
                  sys.exit(1)
          print(f'')
          print(f'=== All {len(plugins)} plugin entries validated ===')
          "

      - name: README table matches marketplace.json
        # A real gate on pull requests only. On a push to main the table is
        # regenerated and committed by the render-readme job below: release tooling
        # bumps marketplace.json on main directly, so gating there just reddened
        # every release.
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/render_readme_table.py --check || {
            echo "::error::README table is out of date — run: python3 scripts/render_readme_table.py && git add README.md"
            exit 1
          }

      - name: Lint marketplace scripts
        run: |
          echo "=== Linting marketplace scripts ==="
          if [ -d "scripts" ]; then
            ruff check scripts/ --select=E,F,W --ignore=E501 || echo "WARNING Some lint warnings (non-blocking)"
          else
            echo "No scripts/ directory to lint"
          fi

  # marketplace.json is bumped straight on main by something other than Update Versions
  # (source unconfirmed: owner-identity commits, ~15 s after the plugin repo commit, no PR),
  # so README.md was left stale after every release and the gate above could never
  # go green on main. The README table is derived data, so on push it is regenerated
  # and committed here instead of being gated. MARKETPLACE_PAT (not GITHUB_TOKEN) is
  # required: the branch ruleset demands a PR for everything except the admin role,
  # which GITHUB_TOKEN is not. Same concurrency group as update-submodules.yml so the
  # two writers to the marker block never interleave.
  render-readme:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: update-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.MARKETPLACE_PAT }}

      - name: Regenerate README plugin table and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 scripts/render_readme_table.py
            if git diff --quiet -- README.md; then
              echo "README table already current"
              exit 0
            fi
            git add README.md
            git commit -m "chore: regenerate README plugin table from marketplace.json"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            # A concurrent push moved the branch: drop our commit and render again
            # from the new tip instead of replaying a table built from a stale manifest.
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
          done
          echo "::error::README regenerate push failed after 3 attempts"
          exit 1
