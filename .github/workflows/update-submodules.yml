# Auto-update marketplace versions when plugins are pushed
# This workflow is triggered by repository_dispatch from plugin repos
#
# Setup:
#   1. Add this workflow to your marketplace repo
#   2. Add notify-marketplace.yml to each plugin repo
#   3. Create a PAT with 'repo' scope and add as MARKETPLACE_PAT secret in plugin repos

name: Update Versions

on:
  # Triggered by plugin repos when they push updates
  repository_dispatch:
    types: [plugin-updated]

  # Manual trigger for testing or recovery
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Specific plugin name to update (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write

# Serialize dispatch events to prevent race conditions on git push
concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.MARKETPLACE_PAT }}

      - name: Show trigger info
        # client_payload.* is attacker-controlled on repository_dispatch, so it
        # reaches the shell as an environment variable rather than as ${{ }}
        # interpolation, which would splice it into the script text itself.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PLUGIN: ${{ github.event.client_payload.plugin }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_ACTOR: ${{ github.event.client_payload.triggered_by }}
        run: |
          echo "Triggered by: $EVENT_NAME"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "Plugin: $PAYLOAD_PLUGIN"
            echo "Ref: $PAYLOAD_REF"
            echo "Actor: $PAYLOAD_ACTOR"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and update plugin version
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          # Untrusted on repository_dispatch — never interpolated into script text.
          PLUGIN: ${{ github.event.client_payload.plugin || inputs.plugin }}
          # Declared here rather than exported in the body: `export` is
          # process-local, so it would reach only this step's own heredocs and
          # silently not the next step's. Step-level env: makes the scope
          # explicit and correct for both the shell and os.environ.
          MARKETPLACE_JSON: .claude-plugin/marketplace.json
        run: |

          if [ -z "$PLUGIN" ]; then
            echo "No specific plugin specified, updating all..."
            # Read all plugin names from marketplace.json
            PLUGINS=$(python3 -c "
          import json
          with open('$MARKETPLACE_JSON') as f:
              data = json.load(f)
          for p in data.get('plugins', []):
              name = p.get('name', '')
              source = p.get('source', {})
              if isinstance(source, dict) and source.get('source') == 'github':
                  repo_val = source.get('repo', '')
                  print(f'{name}|{repo_val}')
                  continue
              if isinstance(source, dict) and source.get('source') == 'url':
                  repo = source.get('url', '').rstrip('/').removesuffix('.git')
                  owner_repo = '/'.join(repo.split('/')[-2:])
                  print(f'{name}|{owner_repo}')
          ")
          else
            # Single plugin - extract repo from marketplace.json
            # PLUGIN and MARKETPLACE_JSON are read from the ENVIRONMENT, never
            # spliced into this source. Interpolating them left a single quote in
            # a dispatch payload able to close the string and execute arbitrary
            # Python with contents:write and the MARKETPLACE_PAT in scope.
            REPO_INFO=$(python3 -c "
          import json, os
          plugin = os.environ['PLUGIN']
          with open(os.environ['MARKETPLACE_JSON']) as f:
              data = json.load(f)
          for p in data.get('plugins', []):
              if p.get('name') == plugin:
                  source = p.get('source', {})
                  if isinstance(source, dict) and source.get('source') == 'github':
                      repo_val = source.get('repo', '')
                      print(f'{plugin}|{repo_val}')
                  elif isinstance(source, dict) and source.get('source') == 'url':
                      repo = source.get('url', '').rstrip('/').removesuffix('.git')
                      owner_repo = '/'.join(repo.split('/')[-2:])
                      print(f'{plugin}|{owner_repo}')
                  break
          ")
            PLUGINS="$REPO_INFO"
          fi

          UPDATED=0
          echo "$PLUGINS" | while IFS='|' read -r name owner_repo; do
            if [ -z "$name" ] || [ -z "$owner_repo" ]; then
              continue
            fi
            echo "Fetching version for $name from $owner_repo..."

            # Fetch plugin.json from the plugin repo via GitHub API
            VERSION=$(gh api "repos/$owner_repo/contents/.claude-plugin/plugin.json" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")

            if [ -n "$VERSION" ]; then
              echo "  $name: found version $VERSION"
              # Update marketplace.json
              python3 -c "
          import json
          with open('$MARKETPLACE_JSON') as f:
              data = json.load(f)
          for p in data.get('plugins', []):
              if p.get('name') == '$name':
                  old = p.get('version', 'unknown')
                  if old != '$VERSION':
                      p['version'] = '$VERSION'
                      pname = p.get('name', '?')
                      print(f'  Updated {pname}: {old} -> $VERSION')
                  else:
                      pname = p.get('name', '?')
                      print(f'  {pname}: already at $VERSION')
                  break
          with open('$MARKETPLACE_JSON', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
            else
              echo "  WARNING: Could not fetch version for $name"
            fi
          done

      - name: Regenerate README plugin table
        # marketplace.json is the single source of truth for BOTH the version
        # cells and which plugins are listed. This step runs BEFORE the change
        # check so a README-only drift still produces a commit: without it the
        # table was never machine-maintained and had drifted five versions and
        # six phantom rows out of date.
        run: python3 scripts/render_readme_table.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          # Untrusted on repository_dispatch — never interpolated into script text.
          PLUGIN: ${{ github.event.client_payload.plugin || inputs.plugin || 'all' }}
        run: |
          # README.md is regenerated from marketplace.json by the step above;
          # staging only the manifest is what left the table unmaintained.
          git add .claude-plugin/marketplace.json README.md

          if [ "$PLUGIN" != "all" ]; then
            NEW_VERSION=$(python3 -c "
          import json, os
          plugin = os.environ['PLUGIN']
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          for p in data.get('plugins', []):
              if p.get('name') == plugin:
                  print(p.get('version', 'unknown'))
                  break
          " || echo "unknown")
            # stderr is deliberately NOT sent to /dev/null: a failure here is
            # non-fatal (a commit message must not break the push) but it used to
            # be invisible, producing a plausible-looking "update X to unknown"
            # with no trace of why. Visible in the log, still non-fatal.
            git commit -m "chore: update $PLUGIN to $NEW_VERSION"
          else
            git commit -m "chore: sync marketplace.json plugin versions"
          fi

          # Retry push with pull-rebase in case of concurrent updates.
          # After each rebase the README must be re-rendered and amended: this
          # commit rewrites the WHOLE marker block, so replaying it onto a peer's
          # newer marketplace.json would otherwise reinstate the pre-rebase table
          # and silently revert their row.
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              pushed=true
              break
            fi
            echo "Push failed (attempt $attempt), pulling and retrying..."
            # Steps run under `bash -eo pipefail`, so a CONFLICTING rebase would
            # otherwise abort the step mid-rebase, leaving the checkout in a
            # rebase-in-progress state and skipping the re-render below. Handle
            # it explicitly: unwind cleanly and fail loudly. A conflict here means
            # a concurrent writer rewrote the same marker block, which a human
            # should look at rather than a retry loop paper over.
            if ! git pull --rebase origin main; then
              # Discriminate the two failure kinds: `git rebase --abort` succeeds
              # ONLY when a rebase is actually in progress, i.e. a real content
              # conflict. Anything else (network, auth, unrelated histories) left
              # no rebase to abort and is exactly what this retry loop is for —
              # failing hard there would turn the most common transient case into
              # a red job.
              if git rebase --abort 2>/dev/null; then
                echo "::error::rebase stopped against origin/main — resolve by hand"
                exit 1
              fi
              echo "pull failed with no rebase in progress (transient) — retrying"
              continue
            fi
            python3 scripts/render_readme_table.py
            if ! git diff --quiet -- README.md; then
              git add README.md
              git commit --amend --no-edit
            fi
          done

          # A loop that exhausts its retries must FAIL the job. Falling through
          # silently reported success on a push that never landed.
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi

      - name: Summary
        env:
          # Untrusted on repository_dispatch — never interpolated into script text.
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PLUGIN: ${{ github.event.client_payload.plugin }}
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** $EVENT_NAME" >> $GITHUB_STEP_SUMMARY
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "**Plugin:** $PAYLOAD_PLUGIN" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### marketplace.json" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          data = json.load(open('.claude-plugin/marketplace.json'))
          for p in data.get('plugins', []):
              name = p.get('name', '?')
              ver = p.get('version', '?')
              print(f'  {name}: {ver}')
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
